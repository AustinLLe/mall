---
version: 2.0

env:
  resource:
    type: docker
    arch: X86
    class: 2U8G

steps:
  PRE_BUILD:
    - checkout:
        name: checkout
        inputs:
          scm: codehub
          url: https://codehub.devcloud.cn-north-4.huaweicloud.com/a111c887c5a545eda4c6976ba10c1a75/NewSecondMall.git
          branch: ${codeBranch}
          lfs: true
          submodule: true
          depth: 1

  BUILD:
    - maven:
        name: start-env-integration-api
        image: cloudbuild@maven3.9.5-jdk17
        inputs:
          cache: false
          command: |-
            set -euo pipefail
            if [ ! -f scripts/ci-integration-api.sh ]; then
              pom="$(find . /data /var /workspace /tmp -path '*/shopping_back/shopping_back/pom.xml' 2>/dev/null | head -n 1)"
              if [ -z "${pom:-}" ]; then
                echo "找不到仓库根目录"
                exit 1
              fi
              cd "$(dirname "$(dirname "$(dirname "$pom")")")"
            fi
            export CI_DB_PASSWORD="${CI_DB_PASSWORD:?CI_DB_PASSWORD is required}"
            export CI_MYSQL_ROOT_PASSWORD="${CI_MYSQL_ROOT_PASSWORD:?CI_MYSQL_ROOT_PASSWORD is required}"
            bash scripts/ci-integration-api.sh
            if [ -d tests/api/reports ]; then
              tar -czf api-newman-reports.tgz -C tests/api reports
            fi
    - upload_artifact:
        name: upload-api-reports
        inputs:
          path: "api-newman-reports.tgz"
          custom_upload_path: /NewSecondMall-integration-api/
          ignore_fail: true
