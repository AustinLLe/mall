---
version: 2.0

env:
  resource:
    type: docker
    arch: X86
    class: 2U8G

steps:
  PRE_BUILD:
    - checkout:
        name: checkout
        inputs:
          scm: codehub
          url: https://codehub.devcloud.cn-north-4.huaweicloud.com/a111c887c5a545eda4c6976ba10c1a75/NewSecondMall.git
          branch: ${codeBranch}
          lfs: true
          submodule: true
          depth: 1

  BUILD:
    - docker:
        name: e2e-test
        inputs:
          command: |-
            docker pull docker.m.daocloud.io/library/debian:bookworm-slim
            docker build --build-arg DOCKER_HUB=docker.m.daocloud.io --build-arg CI_DB_PASSWORD --build-arg CI_MYSQL_ROOT_PASSWORD -f tests/e2e/Dockerfile.ci -t newsecondmall-e2e-export:ci --target export .
            docker save newsecondmall-e2e-export:ci -o e2e-image.tar
          ignore_fail: true
    - maven:
        name: e2e-extract
        image: cloudbuild@maven3.9.5-jdk17
        inputs:
          cache: false
          command: |-
            set -euo pipefail
            bash scripts/ci-e2e-extract.sh
          ignore_fail: true
    - upload_artifact:
        name: upload-e2e-surefire
        inputs:
          path: "e2e-surefire-reports.tgz"
          custom_upload_path: /NewSecondMall-e2e/
          ignore_fail: true
    - upload_artifact:
        name: upload-e2e-artifacts
        inputs:
          path: "e2e-artifacts.tgz"
          custom_upload_path: /NewSecondMall-e2e/
          ignore_fail: true
    - maven:
        name: e2e-gate
        image: cloudbuild@maven3.9.5-jdk17
        inputs:
          cache: false
          command: |-
            set -euo pipefail
            if [ ! -f e2e-exit-code.txt ]; then
              echo "E2E 没有写出退出码，测试步骤可能没跑完"
              exit 1
            fi
            status="$(tr -d '[:space:]' < e2e-exit-code.txt)"
            echo "E2E 退出码: ${status}"
            exit "${status}"
