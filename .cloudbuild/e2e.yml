---
version: 2.0

env:
  resource:
    type: docker
    arch: X86
    class: 2U8G

steps:
  PRE_BUILD:
    - checkout:
        name: checkout
        inputs:
          scm: codehub
          url: https://codehub.devcloud.cn-north-4.huaweicloud.com/a111c887c5a545eda4c6976ba10c1a75/NewSecondMall.git
          branch: ${codeBranch}
          lfs: true
          submodule: true
          depth: 1

  BUILD:
    - docker:
        name: e2e-test
        inputs:
          command: |-
            set -euo pipefail
            if [ ! -f scripts/ci-e2e.sh ]; then
              pom="$(find . /data /var /workspace /tmp -path '*/shopping_back/shopping_back/pom.xml' 2>/dev/null | head -n 1)"
              if [ -z "${pom:-}" ]; then
                echo "找不到仓库根目录"
                exit 1
              fi
              cd "$(dirname "$(dirname "$(dirname "$pom")")")"
            fi
            export CI_DB_PASSWORD="${CI_DB_PASSWORD:?CI_DB_PASSWORD is required}"
            export CI_MYSQL_ROOT_PASSWORD="${CI_MYSQL_ROOT_PASSWORD:?CI_MYSQL_ROOT_PASSWORD is required}"
            bash scripts/ci-e2e.sh
          ignore_fail: true
    - upload_artifact:
        name: upload-e2e-surefire
        inputs:
          path: "e2e-surefire-reports.tgz"
          custom_upload_path: /NewSecondMall-e2e/
          ignore_fail: true
    - upload_artifact:
        name: upload-e2e-artifacts
        inputs:
          path: "e2e-artifacts.tgz"
          custom_upload_path: /NewSecondMall-e2e/
          ignore_fail: true
    - maven:
        name: e2e-gate
        image: cloudbuild@maven3.9.5-jdk17
        inputs:
          cache: false
          command: |-
            set -euo pipefail
            if [ ! -f e2e-exit-code.txt ]; then
              echo "E2E 没有写出退出码，测试步骤可能没跑完"
              exit 1
            fi
            status="$(tr -d '[:space:]' < e2e-exit-code.txt)"
            echo "E2E 退出码: ${status}"
            exit "${status}"
