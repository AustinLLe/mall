---
version: 2.0

env:
  resource:
    type: docker
    arch: X86
    class: 2U8G

steps:
  PRE_BUILD:
    - checkout:
        name: checkout
        inputs:
          scm: codehub
          url: https://codehub.devcloud.cn-north-4.huaweicloud.com/a111c887c5a545eda4c6976ba10c1a75/NewSecondMall.git
          branch: ${codeBranch}
          lfs: true
          submodule: true
          depth: 1

  BUILD:
    - swr:
        name: publish-and-deploy
        image: cloudbuild@docker20.10
        inputs:
          command: |-
            set -u
            mkdir -p ci-artifacts
            command -v ssh >/dev/null 2>&1 || (apk add --no-cache openssh-client curl || (apt-get update && apt-get install -y openssh-client curl))
            export IMAGE_TAG="release-${PIPELINE_NUMBER}-${COMMIT_ID_SHORT}"
            export SOURCE_BRANCH="master"
            export CI_ARTIFACT_DIR="$PWD/ci-artifacts"
            set +e
            bash scripts/ci-release.sh
            status=$?
            printf '%s\n' "$status" > ci-artifacts/release-status
            exit 0
    - upload_artifact:
        name: upload-release-evidence
        inputs:
          path: "ci-artifacts/**"
    - swr:
        name: release-gate
        image: cloudbuild@docker20.10
        inputs:
          command: |-
            status="$(cat ci-artifacts/release-status)"
            test "$status" = "0"
