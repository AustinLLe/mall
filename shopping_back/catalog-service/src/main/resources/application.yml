server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    # 商品/店铺/评价数据仍在原单体库 shop_db 中（含 users 表的只读 JOIN）
    url: jdbc:mysql://localhost:3306/shop_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:shop_user}
    password: ${DB_PASSWORD:shop_pass_123}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 用户身份解析走 user-service（Token 在 user-service 内存中）
user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://127.0.0.1:8081}

app:
  upload:
    dir: ${APP_UPLOAD_DIR:${java.io.tmpdir}/catalog-service-upload}

logging:
  level:
    com.example.catalogservice: DEBUG
