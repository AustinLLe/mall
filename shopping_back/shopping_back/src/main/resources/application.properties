spring.application.name=shopping_back

# 可选本地私密配置：用于 IntelliJ 运行时读取 API Key，不提交到仓库
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties,optional:file:../application-local.properties,optional:file:../../application-local.properties

# 数据源配置：默认连本机 MySQL，可用环境变量覆盖
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop_db?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:shop_user}
spring.datasource.password=${DB_PASSWORD:shop_pass_123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CORS：多个来源用英文逗号分隔；生产务必改为你的前端域名模式
app.cors.allowed-origin-patterns=${APP_CORS_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# 上传目录：默认写到系统临时目录；生产环境可通过 APP_UPLOAD_DIR 指定持久化目录
app.upload.dir=${APP_UPLOAD_DIR:${java.io.tmpdir}/shopping-back-upload}

# OpenAI：不要把 key 写进代码，启动后端前通过环境变量配置 OPENAI_API_KEY
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.responses.url=${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}

# DashScope / 阿里云百炼：优先读取 DASHSCOPE_API_KEY，默认使用中国北京兼容 OpenAI 接口
dashscope.api.key=${DASHSCOPE_API_KEY:}
dashscope.model=${DASHSCOPE_MODEL:qwen-plus}
dashscope.chat.url=${DASHSCOPE_CHAT_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
