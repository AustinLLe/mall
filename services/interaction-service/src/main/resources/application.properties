spring.application.name=interaction-service
server.port=${SERVER_PORT:8084}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interaction_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:shop_user}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.continue-on-error=true
app.auth.base-url=${AUTH_BASE_URL:http://127.0.0.1:8081}
app.user.base-url=${USER_BASE_URL:http://127.0.0.1:8081}
app.catalog.base-url=${CATALOG_BASE_URL:http://127.0.0.1:8082}
