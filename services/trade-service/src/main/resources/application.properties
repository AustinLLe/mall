spring.application.name=trade-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trade_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:shop_user}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.continue-on-error=false
app.catalog.base-url=${CATALOG_BASE_URL:http://localhost:8082}
app.catalog.connect-timeout-ms=${CATALOG_CONNECT_TIMEOUT_MS:500}
app.catalog.read-timeout-ms=${CATALOG_READ_TIMEOUT_MS:1000}
app.user.base-url=${USER_BASE_URL:http://localhost:8081}
