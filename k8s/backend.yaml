apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: newsecondmall
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: newsecondmall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: newsecondmall-backend:20260826-test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/shop_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
            - name: DB_USERNAME
              value: shop_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: newsecondmall-secrets
                  key: DB_PASSWORD
            - name: APP_CORS_PATTERNS
              value: http://localhost:8088
            - name: APP_UPLOAD_DIR
              value: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/products
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/products
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
