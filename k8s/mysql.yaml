apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: newsecondmall
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: newsecondmall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: shop_db
            - name: MYSQL_USER
              value: shop_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: newsecondmall-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: newsecondmall-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/001-schema.sql
              subPath: db.sql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: schema
          configMap:
            name: newsecondmall-db-schema
