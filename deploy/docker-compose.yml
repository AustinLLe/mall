services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shop_db
      MYSQL_USER: ${DB_USERNAME:-shop_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../shopping_back/shopping_back/doc/db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shop_internal

  backend:
    image: newsecondmall-backend:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/shop_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-shop_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_CORS_PATTERNS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      APP_UPLOAD_DIR: /app/uploads
      AI_BARGAIN_API_KEY: ${AI_BARGAIN_API_KEY:-}
      DASH_SCOPE_API_KEY: ${DASH_SCOPE_API_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      TZ: Asia/Shanghai
    volumes:
      - upload_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shop_internal

  frontend:
    image: newsecondmall-frontend:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        H5_DIST_DIR: ${H5_DIST_DIR:-shopping_front/dist/build/h5}
    restart: unless-stopped
    # 唯一对外端口。不要给 backend / mysql 增加 ports。
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shop_internal

volumes:
  mysql_data:
  upload_data:

networks:
  shop_internal:
    driver: bridge
