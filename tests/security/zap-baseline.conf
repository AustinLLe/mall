# OWASP ZAP baseline policy. Format: rule-id  action  description
# High-value response-header rules fail the pipeline; tune only with a reviewed reason.
10010	WARN	Cookie No HttpOnly Flag
10011	WARN	Cookie Without Secure Flag
10015	FAIL	Incomplete or No Cache-control Header
10020	FAIL	Missing Anti-clickjacking Header
10021	FAIL	X-Content-Type-Options Header Missing
10035	WARN	Strict-Transport-Security Header Not Set
10038	WARN	Content-Security-Policy Header Not Set
